<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fincove - AI Voice Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="bot.css">
</head>
<style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.chat-container {
    display: flex;
    width: 100%;
    max-width: 1200px;
    height: 80vh;
    min-height: 600px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    width: 280px;
    background: linear-gradient(180deg, #4f46e5 0%, #7c3aed 100%);
    padding: 24px;
    display: flex;
    flex-direction: column;
    color: white;
}

.sidebar-header {
    margin-bottom: 32px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
}

.logo-icon {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
}

.logo span {
    font-size: 20px;
    font-weight: 600;
}

.new-chat-btn {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    color: white;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
}

.new-chat-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
}

.past-conversations {
    flex: 1;
    margin-bottom: 24px;
}

.past-conversations p {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 16px;
    opacity: 0.8;
}

.back-to-home {
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 12px;
    transition: all 0.3s ease;
    text-align: center;
    display: block;
}

.back-to-home:hover {
    background: rgba(255, 255, 255, 0.1);
    color: white;
}

/* Main Chat Area */
.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px;
}

.chat-header {
    margin-bottom: 24px;
}

.connection-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: #f8fafc;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    width: fit-content;
}

.indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

.indicator.connecting {
    background: #f59e0b;
}

.indicator.connected {
    background: #10b981;
    animation: none;
}

.indicator.error {
    background: #ef4444;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* Chat Area Card */
.chat-area {
    flex: 1;
    background: #f8fafc;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    overflow-y: auto;
    border: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
}

.welcome-message {
    text-align: center;
    color: #64748b;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.welcome-icon {
    font-size: 48px;
    margin-bottom: 16px;
}

.welcome-message h1 {
    font-size: 24px;
    font-weight: 600;
    color: #1e293b;
    margin-bottom: 8px;
}

.welcome-message p {
    font-size: 16px;
    color: #64748b;
}

/* Messages */
.message {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.3s ease;
    max-width: 70%;
}

.message.user {
    align-self: flex-end;
    align-items: flex-end;
}

.message.bot {
    align-self: flex-start;
    align-items: flex-start;
}

.message-sender {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #64748b;
    padding: 0 8px;
}

.message p {
    padding: 12px 16px;
    border-radius: 16px;
    word-wrap: break-word;
    margin: 0;
    width: fit-content;
    max-width: 100%;
}

.message.user p {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-bottom-right-radius: 4px;
}

.message.bot p {
    background: white;
    color: #1e293b;
    border: 1px solid #e2e8f0;
    border-bottom-left-radius: 4px;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Input Area Card */
.chat-input-area {
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0;
}

.input-wrapper {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
}

/* Big Microphone Button */
.mic-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
    flex-shrink: 0;
}

.mic-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 24px rgba(239, 68, 68, 0.4);
}

.mic-btn:active {
    transform: scale(0.95);
}

.mic-btn.recording {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    animation: recordingPulse 1.5s infinite;
}

@keyframes recordingPulse {
    0%, 100% {
        box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
    }
    50% {
        box-shadow: 0 4px 24px rgba(16, 185, 129, 0.6);
    }
}

.mic-btn svg {
    width: 28px;
    height: 28px;
}

/* Text Input */
#textInput {
    flex: 1;
    padding: 16px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    font-size: 16px;
    outline: none;
    transition: all 0.3s ease;
    background: #f8fafc;
}

#textInput:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

/* Send Button */
.send-btn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    flex-shrink: 0;
}

.send-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
}

.send-btn svg {
    width: 20px;
    height: 20px;
}

.voice-status {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    font-weight: 500;
}

/* Loading Animation */
.loading-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    background: #f0f9ff;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid #e0f2fe;
}

.loading-indicator.hidden {
    display: none;
}

.dots {
    display: flex;
    gap: 4px;
}

.dots div {
    width: 8px;
    height: 8px;
    background: #0ea5e9;
    border-radius: 50%;
    animation: dotPulse 1.5s infinite;
}

.dots div:nth-child(2) {
    animation-delay: 0.2s;
}

.dots div:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes dotPulse {
    0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
    }
    40% {
        transform: scale(1);
        opacity: 1;
    }
}

/* Modal Styles */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-overlay.hidden {
    display: none;
}

.modal-content {
    background: white;
    border-radius: 20px;
    padding: 32px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.modal-header {
    text-align: center;
    margin-bottom: 24px;
}

.modal-header h2 {
    font-size: 24px;
    font-weight: 600;
    color: #1e293b;
    margin-bottom: 8px;
}

.modal-header p {
    color: #64748b;
    font-size: 16px;
}

.modal-body {
    margin-bottom: 24px;
}

.modal-body.hidden {
    display: none;
}

.modal-body input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 16px;
    outline: none;
    transition: all 0.3s ease;
}

.modal-body input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.btn-primary {
    width: 100%;
    padding: 14px 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
}

.modal-footer {
    text-align: center;
    font-size: 14px;
    color: #64748b;
}

/* Responsive Design */
@media (max-width: 768px) {
    .chat-container {
        flex-direction: column;
        height: 100vh;
        border-radius: 0;
    }
    
    .sidebar {
        width: 100%;
        padding: 16px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        height: auto;
    }
    
    .sidebar-header {
        margin-bottom: 0;
        display: flex;
        align-items: center;
        gap: 16px;
    }
    
    .logo {
        margin-bottom: 0;
    }
    
    .new-chat-btn {
        width: auto;
        padding: 8px 16px;
    }
    
    .past-conversations {
        display: none;
    }
    
    .sidebar-footer {
        display: none;
    }
    
    .chat-main {
        padding: 16px;
    }
    
    .input-wrapper {
        gap: 12px;
    }
    
    .mic-btn {
        width: 56px;
        height: 56px;
    }
    
    .mic-btn svg {
        width: 24px;
        height: 24px;
    }
} 
</style>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">V</div>
                    <span>Fincove AI</span>
                </div>
                <button class="new-chat-btn">+ New Chat</button>
            </div>
            <div class="past-conversations">
                <p>Recent</p>
                <!-- Past conversations will be listed here -->
            </div>
            <div class="sidebar-footer">
                <a href="index.html" class="back-to-home">Back to Home</a>
            </div>
        </div>
        <div class="chat-main">
            <div class="chat-header">
                <div id="status" class="connection-status">
                    <div class="indicator connecting"></div>
                    <span>Connecting...</span>
                </div>
            </div>
            <div id="chatArea" class="chat-area">
                 <div class="welcome-message">
                    <div class="welcome-icon">&#128075;</div>
                    <h1>Welcome to Fincove AI</h1>
                    <p>Start a conversation by typing or using your voice below.</p>
                </div>
            </div>
            <div id="loading" class="loading-indicator hidden">
                <div class="dots">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <span>Maya is thinking...</span>
            </div>
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <button id="micBtn" class="mic-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                    </button>
                    <input type="text" id="textInput" placeholder="Ask by text anything...">
                    <button id="sendBtn" class="send-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <span id="voiceStatus" class="voice-status"></span>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Secure Authentication</h2>
                <p>Verify your identity to continue.</p>
            </div>
            <div id="phoneInput" class="modal-body">
                <input type="tel" id="phone" placeholder="Enter 10-digit phone number">
                <button onclick="sendOTP()" class="btn-primary">Send OTP</button>
            </div>
            <div id="otpInput" class="modal-body hidden">
                <input type="text" id="otp" placeholder="Enter OTP">
                <button onclick="verifyOTP()" class="btn-primary">Verify OTP</button>
            </div>
            <div id="authStatus" class="modal-footer"></div>
        </div>
    </div>

    <audio id="audio" autoplay></audio>
    <script src="bot.js"></script>
</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
    // Global variables
    const statusEl = document.getElementById("status");
    const loadingEl = document.getElementById("loading");
    const textInput = document.getElementById("textInput");
    const audio = document.getElementById("audio");
    const chatArea = document.getElementById("chatArea");
    const micBtn = document.getElementById("micBtn");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.querySelector(".new-chat-btn");
    const voiceStatus = document.getElementById("voiceStatus");

    let mediaSource = new MediaSource();
    let sourceBuffer;
    let queue = [];
    let ws;
    let sessionId = null;
    let currentIntent = null;
    let lastUserMessage = null; // To store the last message before auth
    let isRecording = false;
    let recognition;

    // Initialize audio
    audio.src = URL.createObjectURL(mediaSource);

    // WebSocket initialization
    function initializeWebSocket() {
        if (ws && ws.readyState === WebSocket.OPEN) return;
        
        updateConnectionStatus("connecting");
        ws = new WebSocket("ws://34.0.5.211:8000/ws/stream");
        ws.binaryType = "arraybuffer";

        ws.onopen = () => updateConnectionStatus("connected");
        ws.onclose = () => updateConnectionStatus("disconnected");
        ws.onerror = () => updateConnectionStatus("error");
        ws.onmessage = handleWebSocketMessage;
    }

    // Update connection status with modern styling
    function updateConnectionStatus(status) {
        const indicator = statusEl.querySelector('.indicator');
        const text = statusEl.querySelector('span');
        
        indicator.className = 'indicator'; // Reset classes

        switch(status) {
            case "connected":
                indicator.classList.add('connected');
                text.textContent = "Connected";
                break;
            case "disconnected":
                indicator.classList.add('disconnected');
                text.textContent = "Disconnected";
                break;
            case "error":
                indicator.classList.add('error');
                text.textContent = "Connection Error";
                break;
            default:
                indicator.classList.add('connecting');
                text.textContent = "Connecting...";
        }
    }

    // MediaSource setup
    mediaSource.addEventListener("sourceopen", () => {
        if (!sourceBuffer) {
            sourceBuffer = mediaSource.addSourceBuffer("audio/mpeg");
            sourceBuffer.mode = "sequence";
            sourceBuffer.addEventListener("updateend", () => {
                if (queue.length > 0 && !sourceBuffer.updating) {
                    sourceBuffer.appendBuffer(queue.shift());
                }
            });
        }
    });

    // Handle WebSocket messages
    function handleWebSocketMessage(event) {
        if (event.data instanceof ArrayBuffer) {
            loadingEl.classList.add("hidden");
            if (sourceBuffer && (sourceBuffer.updating || queue.length > 0)) {
                queue.push(event.data);
            } else if (sourceBuffer) {
                sourceBuffer.appendBuffer(event.data);
            }
        } else {
            const message = JSON.parse(event.data);
            switch(message.type) {
                case "session":
                    sessionId = message.session_id;
                    break;
                case "auth_required":
                    sessionId = message.SID;
                    currentIntent = message.intent;
                    showAuthModal(message.message);
                    break;
                case "text":
                    addMessage(message.data, "bot");
                    break;
            }
        }
    }

    // Enhanced message display
    function addMessage(text, sender) {
        const welcomeMessage = chatArea.querySelector('.welcome-message');
        if (welcomeMessage) {
            welcomeMessage.remove();
        }

        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message", sender);

        const senderName = sender === 'user' ? 'You' : 'Maya';
        
        // Create sender name element
        const senderDiv = document.createElement("div");
        senderDiv.classList.add("message-sender");
        senderDiv.textContent = senderName;
        
        // Create message content element
        const contentP = document.createElement("p");
        contentP.textContent = text;
        
        // Append elements to message container
        msgDiv.appendChild(senderDiv);
        msgDiv.appendChild(contentP);
        
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Send text message
    function sendText() {
        const text = textInput.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

        // Save audio state before sending message
        const wasPlaying = !audio.paused;
        const currentTime = audio.currentTime;

        addMessage(text, "user");
        lastUserMessage = text; // Store the message before sending
        ws.send(text);
        textInput.value = "";

        // Only reset queue if we're not currently playing audio
        if (!wasPlaying) {
            queue = [];
        }
        
        loadingEl.classList.remove("hidden");

        // Only reset MediaSource if it's in an ended state and we're not playing
        if ((mediaSource.readyState === "ended" || mediaSource.readyState === "closed") && !wasPlaying) {
            mediaSource = new MediaSource();
            audio.src = URL.createObjectURL(mediaSource);
            mediaSource.dispatchEvent(new Event('sourceopen'));
        } else if (wasPlaying && audio.paused) {
            // Restore audio playback if it was interrupted
            audio.currentTime = currentTime;
            audio.play().catch(err => console.error('Error resuming audio:', err));
        }
    }

    // Event Listeners for input
    textInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            sendText();
        }
    });

    sendBtn.addEventListener("click", sendText);

    // Speech Recognition Setup
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = "en-IN";
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isRecording = true;
            voiceStatus.textContent = "Listening...";
            micBtn.classList.add('recording');
        };

        recognition.onresult = (event) => {
            // Save audio state before processing result
            const wasPlaying = !audio.paused;
            const currentTime = audio.currentTime;
            
            const transcript = Array.from(event.results)
                .map(result => result[0])
                .map(result => result.transcript)
                .join('');
            textInput.value = transcript;
            
            // Use setTimeout to allow the recognition to complete before sending
            // This prevents audio interruption
            setTimeout(() => {
                sendText();
                
                // Restore audio state if needed
                if (wasPlaying && audio.paused) {
                    audio.currentTime = currentTime;
                    audio.play().catch(err => console.error('Error resuming audio:', err));
                }
            }, 100);
        };

        recognition.onerror = (event) => {
            voiceStatus.textContent = `Error: ${event.error}`;
        };

        recognition.onend = () => {
            isRecording = false;
            voiceStatus.textContent = "";
            micBtn.classList.remove('recording');
        };
    } else {
        voiceStatus.textContent = "Speech recognition not supported.";
        micBtn.disabled = true;
    }

    micBtn.addEventListener("click", () => {
        if (!recognition) return;
        
        // Save audio state before toggling recognition
        const wasPlaying = !audio.paused;
        const currentTime = audio.currentTime;
        
        if (isRecording) {
            recognition.stop();
        } else {
            recognition.start();
        }
        
        // Restore audio state if it was playing
        if (wasPlaying && audio.paused) {
            audio.currentTime = currentTime;
            audio.play().catch(err => console.error('Error resuming audio:', err));
        }
    });

    // New Chat Functionality
    newChatBtn.addEventListener("click", () => {
        chatArea.innerHTML = `
            <div class="welcome-message">
                <div class="welcome-icon">&#128075;</div>
                <h1>Welcome to Fincove AI</h1>
                <p>Start a conversation by typing or using your voice below.</p>
            </div>`;

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "end_session", session_id: sessionId }));
            ws.close();
        }
        setTimeout(initializeWebSocket, 100);
    });

    // Authentication Functions
    const authModal = document.getElementById("authModal");
    const phoneInputDiv = document.getElementById("phoneInput");
    const otpInputDiv = document.getElementById("otpInput");
    const authStatus = document.getElementById("authStatus");

    window.showAuthModal = (message) => {
        authModal.classList.remove("hidden");
        phoneInputDiv.classList.remove("hidden");
        otpInputDiv.classList.add("hidden");
        authStatus.textContent = message;
    }

    window.sendOTP = async () => {
        const phoneEl = document.getElementById("phone");
        let phone = phoneEl.value.replace(/\D/g, '');
        if (!phone.startsWith('+')) {
            phone = `+91${phone}`;
        }

        try {
            const response = await fetch("http://34.0.5.211:8000/auth/send-otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ phone, session_id: sessionId }),
            });
            if (response.ok) {
                phoneInputDiv.classList.add("hidden");
                otpInputDiv.classList.remove("hidden");
                authStatus.textContent = "OTP sent successfully!";
            } else {
                const error = await response.json();
                authStatus.textContent = error.detail || "Failed to send OTP";
            }
        } catch (error) {
            authStatus.textContent = "Error sending OTP.";
        }
    }

    window.verifyOTP = async () => {
        const phone = document.getElementById("phone").value;
        const otp = document.getElementById("otp").value;
        
        if (!sessionId) {
            authStatus.textContent = "Session ID not found. Please refresh.";
            return;
        }
        
        try {
            const response = await fetch("http://34.0.5.211:8000/auth/verify-otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ phone, code: otp }),
            });

            if (response.ok) {
                const data = await response.json();
                if (data.verified) {
                    authModal.classList.add("hidden");
                    ws.send(JSON.stringify({ type: "verification_complete", session_id: sessionId }));

                    // Resend the original message that triggered auth
                    // Resend the original message that triggered auth
                    if (lastUserMessage) {
                        // No need to add the message to the UI again, as it's already there.
                        ws.send(lastUserMessage);
                        lastUserMessage = null; // Clear after sending
                    }
                }
            } else {
                const error = await response.json();
                authStatus.textContent = error.detail || "Invalid OTP.";
            }
        } catch (error) {
            authStatus.textContent = "Error verifying OTP.";
        }
    }

    // Initial load
    initializeWebSocket();
});
</script>
</html>
